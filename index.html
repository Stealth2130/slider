<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="main__text">
        <div class="main__text_title">
          <h1>Completed projects</h1>
          <p>
            Only a small part of the work performed by our company is presented
            on the site. For 14 years on in the construction market we have made
            happy more than 1000 families
          </p>
        </div>
        <div class="main__text_specifications">
          <div class="text__specifications city">
            <h3>CITY:</h3>
          </div>
          <div class="text__specifications area">
            <h3>APARTMENT AREA:</h3>
          </div>
          <div class="text__specifications time">
            <h3>REPAIR TIME:</h3>
          </div>
          <div>
            <h3>REPAIR COST:</h3>
            <p>Upon request</p>
          </div>
        </div>
      </div>
      <div class="main__navigation">
        <div class="navigation__arrow left">&#8592;</div>
        <div class="navigation__points"></div>
        <div class="navigation__arrow right">&#8594;</div>
      </div>
      <div class="main__images">
        <ul class="main__images_links"></ul>
        <div class="main__images_slider">
          <div class="slider__image"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
